name: Build iOS IPA Container
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Strip All Crashing System References
        run: |
          # Target the exact configuration file path inside the project bundle
          TARGET_FILE="app/Madeira.xcodeproj/project.pbxproj"
          
          # 1. Wipe out the crashing signing script phase completely
          sed -i '' '/Sign bundled dylibs/,/};/d' "$TARGET_FILE" || true
          
          # 2. Forcefully remove all missing emulator target folder hooks
          sed -i '' '/x86_64-vcruntime/d' "$TARGET_FILE" || true
          sed -i '' '/x86_64-wine/d' "$TARGET_FILE" || true
          sed -i '' '/fex-emu/d' "$TARGET_FILE" || true
          sed -i '' '/arm64ec-windows/d' "$TARGET_FILE" || true
          sed -i '' '/x86_64-windows/d' "$TARGET_FILE" || true

      - name: Discover and Compile Xcode Target
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          xcodebuild -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_METHOD="manual" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

          mkdir -p build/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app build/Payload/ || cp -r build/Release-iphoneos/Madeira.app build/Payload/ || true
          cd build && zip -r Madeira.ipa Payload/
          mv Madeira.ipa ../../build/Madeira.ipa || mv Madeira.ipa ../build/Madeira.ipa || true

      - name: Upload Completed Application Package
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Container-IPA
          path: build/Madeira.ipa
