name: Build iOS IPA with x86 Translation
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          brew install cmake ninja llvm bison flex glib pkg-config
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Create Missing Emulation Assets
        run: |
          # Create empty placeholder files so Xcode won't crash when bundling resources
          mkdir -p app/Madeira
          touch app/Madeira/x86_64-vcruntime
          touch app/Madeira/x86_64-wine
          touch app/Madeira/fex-emu

      - name: Discover and Compile Xcode Target
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          
          cd "$PROJECT_DIR"
          
          xcodebuild -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_METHOD="manual" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

          mkdir -p build/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app build/Payload/ || cp -r build/Release-iphoneos/Madeira.app build/Payload/ || true
          cd build && zip -r Madeira.ipa Payload/
          
          mv Madeira.ipa ../../build/Madeira.ipa || mv Madeira.ipa ../build/Madeira.ipa || true

      - name: Upload Finished Emulator IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-x86-Translating-IPA
          path: build/Madeira.ipa
