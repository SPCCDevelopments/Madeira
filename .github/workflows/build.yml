name: Build iOS IPA
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      # 1. Using v4.2.2 completely bypasses the Node 20 deprecation warning
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          brew install cmake ninja llvm bison flex glib pkg-config
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Compile Translation Components
        run: |
          # Make sure scripts have execution permissions
          chmod +x macos/build.sh || true
          
          # Navigate into the actual macos project directory where the build script lives
          cd macos
          ./build.sh

      - name: Build and Package IPA
        run: |
          cd macos
          xcodebuild -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/Madeira.app build/Payload/
          cd build && zip -r Madeira.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: macos/build/Madeira.ipa
