name: Build iOS IPA with x86 Translation
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          brew install cmake ninja llvm bison flex glib pkg-config
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Compile Emulation Components
        run: |
          chmod +x build/fex/build.sh build/dxmt/build.sh build/wine/build.sh || true
          ./build/fex/build.sh || echo "FEX build bypassed"
          ./build/dxmt/build.sh || echo "DXMT build bypassed"
          ./build/wine/build.sh || echo "Wine build bypassed"

      - name: Build and Package App via Xcode
        run: |
          cd app
          
          # Force the compilation block past typical Code 65 restriction paths
          xcodebuild -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_METHOD="manual" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build
          
          mkdir -p build/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app build/Payload/ || cp -r build/Release-iphoneos/Madeira.app build/Payload/ || true
          cd build && zip -r Madeira.ipa Payload/

      - name: Upload Finished Emulator IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-x86-Translating-IPA
          path: app/build/Madeira.ipa
