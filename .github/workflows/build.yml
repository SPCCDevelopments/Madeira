name: Build iOS IPA with x86 Translation
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      # 1. v5 strictly uses Node 24 and completely removes the deprecation warning
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          brew install cmake ninja llvm bison flex glib pkg-config
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Locate and Run Build Scripts
        run: |
          # Dynamically search the repository folders for any hidden compilation setup scripts
          # and force them to become executable without crashing on bad paths
          find . -name "*.sh" -exec chmod +x {} +
          
          # Run the main toolchain installer if it exists in the root folder structure
          if [ -f "./build.sh" ]; then
            ./build.sh
          elif [ -f "./build-scripts/build.sh" ]; then
            ./build-scripts/build.sh
          else
            echo "Skipping direct scripts, proceeding directly to primary Xcode compilation."
          fi

      - name: Build and Package App via Xcode
        run: |
          xcodebuild -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          mkdir -p build/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app build/Payload/ || cp -r build/Release-iphoneos/Madeira.app build/Payload/ || true
          cd build && zip -r Madeira.ipa Payload/

      - name: Upload Finished Emulator IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-x86-Translating-IPA
          path: build/Madeira.ipa
