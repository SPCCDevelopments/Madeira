name: Build iOS IPA with x86 Translation
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          brew install cmake ninja llvm bison flex glib pkg-config
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Initialize Submodule Working Trees
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Build and Package App via Xcode Workspace
        run: |
          cd app
          
          # Force Xcode to accept independent compilation targets and bypass signature blockades
          xcodebuild -workspace Madeira.xcworkspace -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_METHOD="manual" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     clean build
          
          mkdir -p build/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app build/Payload/ || cp -r build/Release-iphoneos/Madeira.app build/Payload/ || true
          cd build && zip -r Madeira.ipa Payload/

      - name: Upload Finished Emulator IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-x86-Translating-IPA
          path: app/build/Madeira.ipa
