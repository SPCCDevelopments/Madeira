name: Build iOS IPA Container
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Strip Sign Scripts and Missing Resource Hooks
        run: |
          cd app
          # 1. Completely delete the crashing 'Sign bundled dylibs' script build phase from the project configuration file
          sed -i '' '/Sign bundled dylibs/,/};/d' project.pbxproj || true
          
          # 2. Prevent Xcode from looking for the missing uncompiled folders
          sed -i '' '/x86_64-vcruntime/d' project.pbxproj || true
          sed -i '' '/x86_64-wine/d' project.pbxproj || true
          sed -i '' '/fex-emu/d' project.pbxproj || true
          sed -i '' '/arm64ec-windows/d' project.pbxproj || true
          sed -i '' '/x86_64-windows/d' project.pbxproj || true

      - name: Discover and Compile Xcode Target
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          # Run the compiler completely ignoring code signing restrictions
          xcodebuild -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_METHOD="manual" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

          # Package the output into a standard zip Payload container format
          mkdir -p build/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app build/Payload/ || cp -r build/Release-iphoneos/Madeira.app build/Payload/ || true
          cd build && zip -r Madeira.ipa Payload/
          mv Madeira.ipa ../../build/Madeira.ipa || mv Madeira.ipa ../build/Madeira.ipa || true

      - name: Upload Completed Application Package
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Container-IPA
          path: build/Madeira.ipa
