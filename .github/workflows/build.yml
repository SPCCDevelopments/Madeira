name: Build iOS IPA
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          brew install cmake ninja llvm bison flex glib pkg-config
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Compile Translation Components
        run: |
          # Give script execution permissions across all build folders
          chmod +x build/*/build.sh
          
          # Execute the core Wine compilation script as requested by the source repo
          ./build/wine/build.sh

      - name: Build and Package IPA
        run: |
          # Build the iOS application using Xcode from the repository root
          xcodebuild -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          # Bundle the app directory into a standard zip payload structure
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/Madeira.app build/Payload/
          cd build && zip -r Madeira.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: build/Madeira.ipa
