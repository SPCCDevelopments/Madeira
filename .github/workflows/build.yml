name: Build iOS IPA Container
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Strip Entitlements Requirement and Inject Mock Assets
        run: |
          # 1. Strip the strict entitlements file mapping from the project file to allow unsigned compilation
          TARGET_FILE="app/Madeira.xcodeproj/project.pbxproj"
          sed -i.bak '/CODE_SIGN_ENTITLEMENTS/d' "$TARGET_FILE"
          
          # 2. Inject mock folders so the resource copier doesn't crash
          mkdir -p app/Madeira/x86_64-vcruntime
          mkdir -p app/Madeira/x86_64-wine
          mkdir -p app/Madeira/fex-emu
          mkdir -p app/Madeira/arm64ec-windows
          mkdir -p app/Madeira/x86_64-windows
          
          echo "placeholder" > app/Madeira/x86_64-vcruntime/dummy.txt
          echo "placeholder" > app/Madeira/x86_64-wine/dummy.txt
          echo "placeholder" > app/Madeira/fex-emu/dummy.txt
          echo "placeholder" > app/Madeira/arm64ec-windows/dummy.txt
          echo "placeholder" > app/Madeira/x86_64-windows/dummy.txt

      - name: Compile Xcode Target
        run: |
          cd app
          
          # Clean the cache
          xcodebuild -project Madeira.xcodeproj -scheme Madeira -configuration Release -sdk iphoneos clean
          
          # Compile with clean manual signature definitions without checking entitlements
          xcodebuild -project Madeira.xcodeproj -scheme Madeira -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_METHOD="manual" build

          # Package into the final .ipa format
          mkdir -p build/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app build/Payload/ || cp -r build/Release-iphoneos/Madeira.app build/Payload/ || true
          cd build && zip -r Madeira.ipa Payload/
          mv Madeira.ipa ../../build/Madeira.ipa || mv Madeira.ipa ../build/Madeira.ipa || true

      - name: Upload Completed Application Package
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Container-IPA
          path: build/Madeira.ipa
